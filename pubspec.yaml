name: cuidamed_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  google_sign_in: 6.2.1
  http: ^1.6.0
  shared_preferences: ^2.5.6
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_cuidamed.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_cuidamed.png"